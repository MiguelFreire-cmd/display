<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teste de @media</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            padding: 20px;
            background-color: olive;
            color: white;
            font-family: Verdana, Geneva, Tahoma, sans-serif;
            height: 300vh;
        }

        h1{
            text-align: center;
            margin-bottom: 20px;
            
        }

        .container{
            display: flex;
            gap: 15px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .box{

            background-color: black;
            width: 100%;
            max-width: 400px;
            height: 200px;
            margin-bottom: 15px;

        }
        .container-position{
            margin-top: 10px;
            width: 100%;
            border: 2px solid chocolate;
            height: 600px;
            overflow: hidden;
            display: flex;
            justify-content: space-between;
            position: relative;
        }
        .filho-tamanho{
            position: absolute;
            width: 200px;
            height:200px;
            background-color:orange;
            
        }
        .filho01__container-position{
            top: 0;
            left: 0;
        }
        .filho02__container-position{
            top: 0;
            right: 0;
        }
        .filho03__container-position{
            bottom:0;
            left: 0;
        }
        .filho04__container-position{
            bottom:0;
            right: 0;

        }
        .whats{
            width: 75px;
            height: 75px;
            background-color: greenyellow;
            border-radius: 50%;
            border: 6px solid #fff;
            position: fixed;
            bottom: 20px;
            right: 40px;
        }
        .whats img{
            width: 100%;
            height: 100%;
        }

        /* For devices with a minimum width of 768px (Medium) */
        @media screen and (min-width: 768px) {
        body {
            background-color: blue;
            color: white;
        }
        .box{
            width: 45%;
            max-width: 600px;
        }
        }

        /* For devices with a minimum width of 992px (Large) */
        @media screen and (min-width: 992px) {
        body {
            background-color: tan;
            color: black;
        }
        .box{
            width: 300px;
        }
        }

    </style>
</head>
<body>
    <header>
        <h1>Teste de media</h1>
    </header>
    <section class="container">
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
        <div class="box"></div>
    </section>

    <div class="container-position">
        <div class="filho01__container-position filho-tamanho"></div>
        <div class="filho02__container-position filho-tamanho"></div>
        <div class="filho03__container-position filho-tamanho"></div>
        <div class="filho04__container-position filho-tamanho"></div>
        
    </div>
    <div class="whats">
        <img src="./IMG/whatsapp.png" alt="Logo whatsapp">
    </div>

</body>
</html>
